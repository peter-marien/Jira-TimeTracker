name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build application for Electron regression check
        run: npx vite build

      - name: Run Electron regression check
        run: npm run test:electron
