name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Check native SQLite with Node.js
        run: npm run test:sqlite

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application for Electron regression check
        run: npm run build:app

      - name: Run Electron regression check
        run: npm run test:electron

      - name: Check application with an isolated database
        run: npm run test:app

      - name: Check tracking transactions against an isolated database
        run: npm run test:electron -- --main
