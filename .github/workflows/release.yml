name: Release

on:
  workflow_dispatch:
    inputs:
      new-version:
        description: "Version bump target (patch, minor, major, or explicit x.y.z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch
        shell: pwsh
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          $branch = git rev-parse --abbrev-ref HEAD
          if ($branch -ne "master") {
              Write-Error "Release must be performed on the 'master' branch. Current branch: $branch"
              exit 1
          }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:VALIDATED_SHA) {
              throw "Release checkout does not match the validated commit."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for uncommitted changes
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
              Write-Error "Working tree is not clean. Please commit or stash changes before releasing."
              exit 1
          }

      - name: Configure Git author
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and create commit/tag
        shell: pwsh
        env:
          NEW_VERSION: ${{ inputs.new-version }}
        run: npm version "$env:NEW_VERSION" -m "Bump version to %s"

      - name: Push version commit and tags
        shell: pwsh
        run: git push origin master --tags

      - name: Trigger release build and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

